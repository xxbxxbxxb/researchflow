[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "researchflow"
version = "1.0.0"
description = "Evidence-grounded research agent system"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2",
    "argon2-cffi>=23,<26",
    "beautifulsoup4>=4.13,<5",
    "defusedxml>=0.7,<1",
    "fastapi>=0.115,<1",
    "httpcore>=1,<2",
    "httpx[socks]>=0.27,<1.0",
    "langgraph>=1.2.15,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.38,<2",
    "opentelemetry-sdk>=1.38,<2",
    "pgvector>=0.3,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic>=2.9,<3",
    "pypdf>=6,<7",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn>=0.30,<1",
]

[project.scripts]
researchflow = "researchflow.cli:main"

[project.optional-dependencies]
dev = [
    "mypy>=2.4.0",
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
    "types-defusedxml>=0.7.0.20260504",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"researchflow.evaluation" = ["data/*.jsonl", "data/*.json", "data/LICENSE.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".superpowers", "web/node_modules", "web/dist", "artifacts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
sqlite_cache = false
warn_unused_ignores = true
