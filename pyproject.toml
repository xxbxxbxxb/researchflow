[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "researchflow"
version = "0.1.0"
description = "Evidence-grounded research agent system"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2",
    "beautifulsoup4>=4.13,<5",
    "defusedxml>=0.7,<1",
    "httpcore>=1,<2",
    "httpx>=0.27,<1.0",
    "pgvector>=0.3,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic>=2.9,<3",
    "pypdf>=6,<7",
    "sqlalchemy>=2.0,<2.1",
]

[project.scripts]
researchflow = "researchflow.cli:main"

[project.optional-dependencies]
dev = [
    "mypy>=2.4.0",
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
