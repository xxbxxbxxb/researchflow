name: ResearchFlow verification
on:
  push:
    branches: [reference/mature-v1]
  pull_request:
concurrency:
  group: researchflow-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '${{ matrix.python }}'}
      - run: python -m pip install uv==0.12.23
      - run: uv sync --locked --extra dev --python ${{ matrix.python }}
      - run: uv run pytest -q --junitxml=artifacts/python-core.xml
      - run: uv run ruff check .
      - run: uv run mypy src/researchflow
      - run: uv run researchflow demo --case supported --format json
      - run: uv run researchflow evaluate --split development --mode contract --output artifacts/evaluation
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: core-${{ matrix.os }}-${{ matrix.python }}
          path: artifacts/
  postgres:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:0.8.6-pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_DB: researchflow_test
          POSTGRES_USER: researchflow
          POSTGRES_PASSWORD: researchflow
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U researchflow -d researchflow_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RF_TEST_DATABASE_URL: postgresql+psycopg://researchflow:researchflow@localhost:5432/researchflow_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.11'}
      - run: python -m pip install uv==0.12.23
      - run: uv sync --locked --extra dev --python 3.11
      - run: uv run pytest -q --junitxml=artifacts/python.xml
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22'}
      - run: npm --prefix web ci
      - run: uv run python scripts/export_openapi.py
      - run: npm --prefix web run generate:api
      - run: git diff --exit-code -- web/src/lib/generated.ts
      - run: npm --prefix web run typecheck
      - run: npm --prefix web run build
      - run: npx --prefix web playwright install --with-deps chromium
      - run: uv run npm --prefix web run test:e2e
      - run: uv run python scripts/verify_release.py --existing-results --output artifacts/verification
      - if: always()
        run: uv run python scripts/e2e_diagnostics.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: real-postgres-and-browser
          path: |
            artifacts/
            web/test-results/
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.12'}
      - run: python -m pip install uv==0.12.23
      - run: uv sync --locked --extra dev --python 3.12
      - run: uv run python scripts/compose_smoke.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: compose-restart
          path: artifacts/compose-smoke.json
  release:
    needs: [core, postgres, compose]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.12'}
      - run: python -m pip install uv==0.12.23
      - run: uv sync --locked --extra dev --python 3.12
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: real-postgres-and-browser
          # Upload has two roots (artifacts/ and web/test-results/), preserving both.
          path: .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: compose-restart
          path: artifacts/
      - run: uv run python scripts/verify_release.py --existing-results --output artifacts/release
      - run: uv run python -c "import json; from pathlib import Path; m=json.loads(Path('artifacts/release/manifest.json').read_text()); assert m['status']=='passed', m"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: complete-engineering-release
          path: artifacts/release/
