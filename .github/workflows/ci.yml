name: ResearchFlow verification
on:
  push:
    branches: [reference/mature-v1]
  pull_request:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:0.8.6-pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_DB: researchflow_test
          POSTGRES_USER: researchflow
          POSTGRES_PASSWORD: researchflow
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U researchflow -d researchflow_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RF_TEST_DATABASE_URL: postgresql+psycopg://researchflow:researchflow@localhost:5432/researchflow_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
