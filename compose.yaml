services:
  db:
    image: pgvector/pgvector:0.8.6-pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_DB: researchflow
      POSTGRES_USER: researchflow
      POSTGRES_PASSWORD: ${RF_POSTGRES_PASSWORD:?Set RF_POSTGRES_PASSWORD}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U researchflow -d researchflow']
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    image: researchflow-reference:local
    command: ['sh','-c','alembic upgrade head && exec researchflow serve --host 0.0.0.0']
    environment: &app-env
      RF_DATABASE_URL: postgresql+psycopg://researchflow:${RF_POSTGRES_PASSWORD:?Set RF_POSTGRES_PASSWORD}@db:5432/researchflow
      RF_PASSWORD_HASH: ${RF_PASSWORD_HASH:?Set RF_PASSWORD_HASH}
      RF_MODE: ${RF_MODE:-demo}
      RF_ALLOWED_ORIGINS: ${RF_ALLOWED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      RF_LLM_BASE_URL: ${RF_LLM_BASE_URL:-}
      RF_LLM_API_KEY: ${RF_LLM_API_KEY:-}
      RF_LLM_MODEL: ${RF_LLM_MODEL:-}
      RF_CONTEXT_WINDOW: ${RF_CONTEXT_WINDOW:-}
      RF_SECURE_COOKIES: ${RF_SECURE_COOKIES:-false}
      RF_PREVIEW_ENABLED: ${RF_PREVIEW_ENABLED:-false}
      RF_EMBEDDING_BASE_URL: ${RF_EMBEDDING_BASE_URL:-}
      RF_EMBEDDING_API_KEY: ${RF_EMBEDDING_API_KEY:-}
      RF_EMBEDDING_MODEL: ${RF_EMBEDDING_MODEL:-}
      RF_EMBEDDING_DIMENSIONS: ${RF_EMBEDDING_DIMENSIONS:-}
      RF_OTLP_TRACES_ENDPOINT: ${RF_OTLP_TRACES_ENDPOINT:-}
    ports: ['127.0.0.1:${RF_BIND_PORT:-8000}:8000']
    volumes: ['source-blobs:/data/blobs']
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD','python','-c','import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health",timeout=3)']
      interval: 5s
      timeout: 5s
      retries: 20
  worker:
    image: researchflow-reference:local
    command: ['researchflow','worker']
    environment: *app-env
    volumes: ['source-blobs:/data/blobs']
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres-data:
  source-blobs:
